// --- SISTEMA DE NOTIFICACIONES TOAST ---
function showToast(mensaje) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = mensaje;
  container.appendChild(toast);
  
  // Animación de entrada
  setTimeout(() => toast.classList.add('show'), 10);
  
  // Desaparecer después de 2.5 segundos
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

// --- ACCIONES ACTUALIZADAS CON TOAST ---
// (Reemplaza estas funciones existentes por estas nuevas)

function setSt(n,s){
  put(`pos/${n}/st`,s);
  stamp(n);
  const nombre = eff(n) || 'Posición ' + n;
  if(s==='ok' || s==='sub') showToast(`✓ ${nombre} marcado como Presente`);
  else if(s==='abs') showToast(`✕ ${nombre} marcado como Ausente`);
  else if(s==='pend') showToast(`⏳ ${nombre} marcado como Pendiente`);
}

function here(n){
  if(P(n).sub===me.n||P(n).who===me.n){
    setSt(n,P(n).sub?'sub':'ok');
  }
}

function useSub(n,name){
  put(`pos/${n}/sub`,name);
  setSt(n,'sub');
  showToast(`✓ Sustituto asignado: ${name}`);
}

function back(n){
  put(`pos/${n}/sub`,null);
  setSt(n,'ok');
}

function setWho(n,v){
  put(`pos/${n}/who`,v);
  put(`pos/${n}/sub`,null);
  setSt(n,'pend');
  if(v) showToast(`✓ Acomodador cambiado a: ${v}`);
}
