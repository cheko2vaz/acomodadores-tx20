<style>
:root{--red:#6e1414;--red2:#9b1c1c;--ink:#1f1f1f;--mut:#666;--line:#d6d6d6;--bg:#e9e9e9;--blue:#2c6cb0;--org:#e07b00;--ok:#2e7d32;--purple:#5B3C88}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:15px/1.4 "Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--red);color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1;min-width:180px}
.net{font-size:12px;padding:3px 9px;border-radius:99px;background:#ffffff33}.net.on::before{content:"● ";color:#7fe08a}.net.off{background:#fff;color:var(--red2);font-weight:700}.net.loc{background:#fff;color:#555}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--red2);color:#fff;border-color:var(--red2)}button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.on{background:#333;color:#fff}
main{max-width:1100px;margin:auto;padding:12px;display:grid;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#alert{border:2px solid var(--red2);color:var(--red2);font-weight:600}
#mapw{overflow:auto;padding:0;-webkit-overflow-scrolling:touch}
svg{width:100%;max-width:100%;height:auto;display:block;touch-action:pan-x pan-y pinch-zoom}
#toast-container{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:#2e7d32;color:#fff;padding:12px 20px;border-radius:8px;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:0;transition:opacity .3s,transform .3s;transform:translateY(20px);display:flex;align-items:center;gap:8px;max-width:340px}
.toast.err{background:#b71c1c}
.toast.show{opacity:1;transform:translateY(0)}
.pc{cursor:pointer}.pc text{font:700 15px sans-serif;fill:#fff;pointer-events:none}
@keyframes bl{50%{opacity:.05}}.pulse{fill:none;stroke:#d11;stroke-width:6;animation:bl .8s infinite}
@media(prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.8}}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;color:#fff}.tag.b{background:var(--blue)}.tag.o{background:var(--org)}.tag.p{background:var(--purple)}
.mut{color:var(--mut)}h3{margin:0 0 4px}
.who{background:#f3f3f3;border-left:4px solid var(--red2);padding:8px 10px;margin:8px 0}
a{color:var(--red2);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.t{border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center}.t b{font-size:24px;display:block}
.bar{height:6px;background:#ddd;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red2)}
.sg{padding:8px 0;border-top:1px solid var(--line)}
#login{position:fixed;inset:0;background:#3a0b0bf2;display:grid;place-items:center;z-index:20;padding:12px;overflow:auto}
#login .card{max-width:420px;width:100%;display:grid;gap:10px}
select,input{font:inherit;padding:9px;border:1px solid #bbb;border-radius:6px;width:100%}
.lg{display:flex;gap:14px;font-size:13px;flex-wrap:wrap}.lg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.sec{fill:transparent;cursor:pointer}.sec.hl{fill:#9b1c1c55;stroke:#d11;stroke-width:3;stroke-dasharray:8 4}.sec.edit{stroke:#d11;stroke-width:1.5;stroke-dasharray:5 3;fill:transparent}
.vertex{cursor:grab;transition:r .1s}.vertex:hover{r:9;stroke-width:3}.vertex:active{cursor:grabbing}
.vadd{cursor:pointer;opacity:.5;transition:opacity .15s}.vadd:hover{opacity:1}
.t{cursor:pointer}.t.hl{border:2px solid var(--red2);background:#faeaea}.dim{opacity:.4}
.capin{width:60px;padding:4px;font-size:13px;text-align:center;border:1px solid #ccc;border-radius:4px}
.turnsel{display:flex;gap:4px;flex-wrap:wrap;width:100%}
.turnsel button{padding:6px 10px;font-size:13px}
.turnsel button.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.histbox{background:#f5f0ff;border-left:4px solid var(--purple);padding:8px 10px;margin:8px 0;font-size:13px}
.vbtn{display:inline-block;margin:3px;padding:8px 10px;border:1px solid var(--ok);background:#e8f5e9;color:var(--ok);border-radius:6px;cursor:pointer;font-size:13px;text-align:left}
.vbtn:hover{background:var(--ok);color:#fff}
.rules{background:#fff3e0;border:1px solid #ffb74d;color:#bf5a00;padding:8px 10px;border-radius:6px;font-size:12px;margin:8px 0;line-height:1.5}
details summary{cursor:pointer;color:var(--mut);font-size:12px;margin-top:8px}
</style>

</div>

<main id="app" hidden>

  <div class="card" id="bench" hidden></div>
</main>

<div id="volPanel" hidden style="max-width:900px;margin:12px auto;">

function volHistory(name){
  const res=[],vt=S.volTurnos||{};
  for(const t in vt)for(const p in vt[t])if(vt[t][p]===name)res.push({turno:+t,posicion:+p});
  return res.sort((a,b)=>a.turno-b.turno);
}
function canAssign(turno,pos,name){
  const t=+turno;
  const volList=TURNOS[t]?TURNOS[t].vol:[];
  if(!volList.includes(name))return{ok:false,msg:"No se apuntó a este turno"};
  const hist=volHistory(name);
  if(hist.find(h=>h.turno===t))return{ok:false,msg:"Ya está en este turno"};
  const sigCount=Object.values(TURNOS).filter(tt=>tt.vol.includes(name)).length;
  const maxT=Math.min(4,sigCount);
  if(hist.length>=maxT)return{ok:false,msg:`Máximo ${maxT} turnos`};
  const consec=hist.find(h=>Math.abs(h.turno-t)===1);
  if(consec){
    const ok12=(t===1&&consec.turno===2)||(t===2&&consec.turno===1);
    if(!ok12)return{ok:false,msg:`Consecutivo con T${consec.turno}`};
  }
  if((t===5&&hist.find(h=>h.turno===6))||(t===6&&hist.find(h=>h.turno===5)))return{ok:false,msg:"T5 y T6 excluyentes"};
  return{ok:true,msg:`OK (${hist.length+1}/${maxT})`};
}
function doAssign(turno,pos,name){
  const chk=canAssign(turno,pos,name);
  if(!chk.ok){showToast(`❌ ${esc(name)}: ${chk.msg}`,true);return}
  if(!S.volTurnos)S.volTurnos={};if(!S.volTurnos[turno])S.volTurnos[turno]={};
  S.volTurnos[turno][pos]=name;
  put(`volTurnos/${turno}/${pos}`,name);
  showToast(`✓ ${esc(name)} → ${sectionOf(pos).label}`);
}
function unassignVol(turno,pos){
  if(!S.volTurnos||!S.volTurnos[turno])return;
  delete S.volTurnos[turno][pos];
  fetch(U(`volTurnos/${turno}/${pos}`),{method:'DELETE'}).then(()=>load());
  showToast("Asignación eliminada");
}

      html+='</ul>';

}

    }).join('')+`</div>`;
  }
  const editBtn=me.all?`<button class="${secEditMode?'on':''}" onclick="secEditMode=!secEditMode;hl=null;draw()" title="Editar zonas (solo acomodadores)">✏️ Zonas</button>`:'';
  const helpEdit=secEditMode?`<div style="width:100%;font-size:12px;background:#fff7cc;padding:6px 8px;border-radius:4px;margin-top:4px">✏️ <b>Modo edición de zonas:</b> Toca una zona para activarla. Arrastra puntos blancos para mover. <b>Toca (sin arrastrar) un punto blanco para borrarlo.</b> Toca los grises "+" para agregar.${hl?` <button style="font-size:11px;padding:2px 6px" onclick="resetSec('${hl}')">↺ Restaurar ${hl}</button>`:''}</div>`:'';
  $('bar').innerHTML=viewBtns+turnSel+`<b>${me.all?'Todas':'Tu área'} · Fijas: ${ok(L)}/${L.length}</b><span>Inter: ${ok(O)}/${O.length}</span><span style="flex:1"></span>`+(me.adm&&(mapView==='acom'||mapView==='vol')?`<button class="${edit?'on':''}" onclick="edit=!edit;draw()">${edit?'Listo':'Mover'}</button>`:'')+(me.all&&mapView==='acom'?`<button onclick="reset()">Reiniciar</button>`:'')+editBtn+helpEdit;
  const a=$('alert');a.hidden=!v.length;a.innerHTML='⚠ Sin cubrir: '+v.map(n=>`<a href="#" onclick="sel=${n};draw();return false">${n}</a>`).join(', ');
}

function drawMine(){const e=$('mine'),n=POS.find(n=>eff(n)===me.n);e.hidden=me.adm||me.all;if(me.adm||me.all)return;e.innerHTML=n?`<h3>Tu posición: ${n}</h3><p>${esc(D.pos[n].t)}</p>`+(['ok','sub'].includes(P(n).st)?'<b style="color:var(--ok)">✓ Registrado.</b>':`<button class="ok" style="width:100%;padding:16px;font-size:18px" onclick="here(${n})">Estoy aquí</button>`):D.caps.includes(me.n)?'<h3>Capitán</h3>':'<h3>Corredor</h3>'}

function drawPanel(){
  const e=$('panel');
  if(!sel){e.innerHTML='<span class="mut">Toca un número del mapa.</span>';return}
  const n=sel,p=P(n),d=D.pos[n],w=eff(n),r=ppl(w),ad=canEd(n),isVol=d.v===1;
  const sec=isVol?sectionOf(n):null;
  if(isVol){
    let h=`<h3 style="color:${sec.color}">Voluntaria ${n} · ${sec.label}</h3>`;
    h+=`<p style="margin:4px 0;font-size:14px"><b>Turno: ${currentTurno} · ${TURNOS[currentTurno].name}</b></p>`;
    h+=`<div class="rules"><b>📋 Reglas activas:</b><br>✅ No consecutivos (excepto T1+T2)<br>✅ Máximo 4 turnos por hermana<br>✅ T5 y T6 son excluyentes (intermedio)</div>`;
    if(w){
      const hist=volHistory(w).filter(x=>!(+x.turno===+currentTurno&&+x.posicion===+n));
      h+=`<div class="who" style="border-left-color:${sec.color}"><b>${esc(w)}</b></div>`;
      if(hist.length){h+=`<div class="histbox"><b>También está en:</b><ul style="margin:4px 0;padding-left:18px">${hist.map(x=>`<li>T${x.turno} · ${sectionOf(x.posicion).label} (${x.posicion})</li>`).join('')}</ul></div>`}
      else h+='<p class="mut" style="font-size:13px">No está en otros turnos.</p>';
      h+=`<button onclick="unassignVol(${currentTurno},${n})" style="margin-top:4px">🗑️ Quitar asignación</button>`;
    }else{
      h+='<p class="mut">Sin asignar en este turno.</p>';
    }
    const vols=TURNOS[currentTurno].vol.map(name=>{const chk=canAssign(currentTurno,n,name);return{name,ok:chk.ok,msg:chk.msg}});
    const avail=vols.filter(v=>v.ok),blocked=vols.filter(v=>!v.ok);
    h+=`<div class="sg"><b>Disponibles (${avail.length}):</b><div style="margin-top:4px">`;
    if(avail.length===0) h+='<p class="mut" style="font-size:13px">Ninguna puede asignarse aquí.</p>';
    else h+=avail.map(v=>`<button class="vbtn" data-vname="${esc(v.name)}" onclick="doAssign(${currentTurno},${n},this.dataset.vname)">✓ ${esc(v.name)}</button>`).join('');
    h+='</div>';
    if(blocked.length){
      h+=`<details style="margin-top:10px"><summary>❌ ${blocked.length} bloqueadas (ver razones)</summary><ul style="margin:6px 0;padding-left:18px;font-size:12px">${blocked.map(v=>`<li><b>${esc(v.name)}</b> — ${v.msg}</li>`).join('')}</ul></details>`;
    }
    h+='</div>';
    e.innerHTML=h;
    return;
  }
  let h=`<h3>Posición ${n} <span class="tag ${d.l?'b':'o'}">${d.l?'Fija':'Intermitente'}</span></h3><div>${esc(d.t)}</div>`;
  h+=w?`<div class="who"><b>${esc(w)}</b>${r?`<br>${PRIV[r.p]} · ${esc(r.c)}`:''}${p.sub?`<br><span class="mut">Sustituto de ${esc(p.who)}</span>`:''}</div>`:'<p class="mut">Sin asignar</p>';
  if(ad){
    h+=`<div class="row"><button class="ok" onclick="setSt(${n},'${p.sub?'sub':'ok'}')">Presente</button><button onclick="setSt(${n},'abs')">Ausente</button>${p.sub?`<button onclick="back(${n})">Llegó titular</button>`:''}</div>`;
    const list=D.roster.filter(r=>r.c!=='Voluntaria');
    h+=`<div class="sg"><b>Asignar Acomodador</b><select onchange="if(this.value)setWho(${n},this.value)"><option value="">Elegir…</option>${list.map(x=>`<option ${x.n===p.who?'disabled':''}>${esc(x.n)}</option>`).join('')}</select></div>`;
  }
  e.innerHTML=h;
}

function drawCnt(){
  $('expEd').hidden=!(me.all||me.cnt);
  if(document.activeElement!==$('exp'))$('exp').value=S.expect||D.expect;
  const t=SEC.reduce((a,s)=>a+((S.cnt||{})[s.id]||0),0),ex=S.expect||D.expect,cc=canCnt(),editable=me.all;
  $('cnt').innerHTML=`<p><b>${t}</b> / <b>${ex}</b> (${Math.round(100*t/ex)}%)</p><div class="bar"><i style="width:${Math.min(100,100*t/ex)}%"></i></div><div class="grid" style="margin-top:10px">`+SEC.map(s=>{const v=(S.cnt||{})[s.id]||0,cap=(S.cap&&S.cap[s.id]!==undefined)?S.cap[s.id]:D.cap[s.id];return`<div class="t${hl===s.id?' hl':''}" onclick="hl=hl==='${s.id}'?null:'${s.id}';draw()"><small>${s.l}</small><b>${v}</b>${editable?`<div style="font-size:12px;margin-top:4px">Sillas: <input class="capin" type="number" min="0" value="${cap}" onchange="event.stopPropagation();setCap('${s.id}',this.value)" onclick="event.stopPropagation()"/></div>`:`<small class="mut">Sillas: ${cap}</small>`}${cc?`<div class="row" style="justify-content:center;margin-top:4px"><button onclick="event.stopPropagation();cnt('${s.id}',-1)">−</button><button onclick="event.stopPropagation();cnt('${s.id}',1)">+</button></div>`:''}</div>`}).join('')+'</div>'
}

function drawBench(){const e=$('bench');e.hidden=!me.adm;if(!me.adm)return;e.innerHTML='<h3>Corredores</h3>'+D.runners.map(x=>{const q=ppl(x),n=POS.find(n=>P(n).sub===x);return`<div class="row sg"><span style="flex:1"><b>${esc(x)}</b></span><span class="mut">${n?'Pos '+n:'Libre'}</span></div>`}).join('')}
const _d=draw;draw=function(){_d();if(me&&!drag)drawBench()};

const svg=$('svg');
svg.addEventListener('pointerdown',e=>{
  const vtx=e.target.closest('.vertex');
  if(vtx){
    dragV={sec:vtx.dataset.sec,idx:+vtx.dataset.idx,startX:e.clientX,startY:e.clientY,moved:false,x:0,y:0};
    try{svg.setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();
    return;
  }
  const add=e.target.closest('.vadd');
  if(add){addVertex(add.dataset.sec,+add.dataset.after,+add.dataset.mx,+add.dataset.my);return}
  const z=e.target.closest('.sec');
  if(z&&!e.target.closest('.pc')){hl=secEditMode?z.dataset.s:(hl===z.dataset.s?null:z.dataset.s);draw();return}
  const g=e.target.closest('.pc');if(!g)return;const n=+g.dataset.n;
  if(edit&&canEd(n)){drag={n,m:0};try{svg.setPointerCapture(e.pointerId)}catch(_){}}else{sel=n;draw()}
});
svg.addEventListener('pointermove',e=>{
  if(dragV){
    if(!dragV.moved && (Math.abs(e.clientX-dragV.startX)>6 || Math.abs(e.clientY-dragV.startY)>6)) dragV.moved=true;
    if(dragV.moved){
      const q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;
      const r=q.matrixTransform(svg.getScreenCTM().inverse());
      dragV.x=Math.round(r.x);dragV.y=Math.round(r.y);
      const el=svg.querySelector(`.vertex[data-sec="${dragV.sec}"][data-idx="${dragV.idx}"]`);
      if(el){el.setAttribute('cx',dragV.x);el.setAttribute('cy',dragV.y)}
    }
    return;
  }
  if(!drag)return;drag.m=1;const q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const r=q.matrixTransform(svg.getScreenCTM().inverse());drag.x=Math.round(r.x);drag.y=Math.round(r.y);const el=svg.querySelector(`[data-n="${drag.n}"]`);if(el)el.setAttribute('transform',`translate(${drag.x} ${drag.y})`)
});
svg.addEventListener('pointerup',()=>{
  if(dragV){
    if(dragV.moved){moveVertex(dragV.sec,dragV.idx,dragV.x,dragV.y)}
    else{delVertex(dragV.sec,dragV.idx)}
    dragV=null;
    return;
  }
  if(!drag)return;const d=drag;drag=null;sel=d.n;if(d.m){put(`pos/${d.n}/x`,d.x);put(`pos/${d.n}/y`,d.y)}else draw()
});

function toggleAppMode(){
  isVolunteerMode=!isVolunteerMode;
  const btn=$('btn-mode-toggle'),app=$('app'),vp=$('volPanel'),title=$('appTitle');
  if(isVolunteerMode){btn.textContent='🚪 Volver';btn.style.background='#6e1414';app.hidden=true;vp.hidden=false;title.textContent='Portal de Voluntarias'}
  else{btn.textContent='👥 Vista Voluntaria';btn.style.background='#2e7d32';app.hidden=false;vp.hidden=true;title.textContent='Acomodadores · La Feria, TX';if(me)draw()}
}
</script>
</body>
